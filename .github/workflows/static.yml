# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install -r requirements.txt
      - name: Build site
        run: |
          set -x
          python3 tools/build.py
          echo "### _site inventory" >> "$GITHUB_STEP_SUMMARY"
          find _site -type f | sort >> "$GITHUB_STEP_SUMMARY"
          {
            echo "=== pwd ==="; pwd
            echo "=== repo root ==="; ls -la
            echo "=== content ==="; find content -type f 2>&1 | sort
            echo "=== _site exists? ==="; ls -la _site 2>&1 | head -40
            echo "=== _site tree ==="; find _site -type f 2>&1 | sort
            echo "=== python ==="; python3 -c "import markdown,sys; print('markdown', markdown.__version__, sys.version)"
          } > diag-root.txt 2>&1
          cp diag-root.txt _site/diag-site.txt 2>/dev/null || echo "could not copy diag into _site"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The built site: hand-written pages plus the generated blog
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
